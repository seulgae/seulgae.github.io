    <script>
      // 이 사이트는 데스크톱 레이아웃 단일 대응이므로, 모바일에서는 뷰포트 폭을
      // 데스크톱 기준으로 고정해 축소된 전체 화면을 보여 줍니다.
      (function () {
        var desktopViewportWidth = 1440;
        var viewport = document.querySelector('meta[name="viewport"]');
        var mobileUserAgent = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        var coarsePointer =
          window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

        if (viewport && (mobileUserAgent || coarsePointer)) {
          viewport.setAttribute("content", "width=" + desktopViewportWidth);
        }
      })();
    </script>
    <script>
      // 404.html이 저장해 둔 원래 경로를 복원합니다. (GitHub Pages SPA 라우팅 대응)
      (function () {
        var redirect = sessionStorage.getItem("spa_redirect");

        if (redirect) {
          sessionStorage.removeItem("spa_redirect");
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
